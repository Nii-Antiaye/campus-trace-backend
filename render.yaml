services:
  - type: web
    name: campus-trace-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.9
      - key: CAMPUS_TRACE_SECRET_KEY
        generateValue: true
      - key: CAMPUS_TRACE_DATABASE_PATH
        value: /var/data/campus_trace.db
      - key: CAMPUS_TRACE_UPLOAD_DIR
        value: /var/data/uploads/item_images
      - key: CAMPUS_TRACE_APP_URL
        sync: false
      - key: CAMPUS_TRACE_CORS_ORIGINS
        sync: false
      - key: CAMPUS_TRACE_SMTP_HOST
        sync: false
      - key: CAMPUS_TRACE_SMTP_PORT
        value: "587"
      - key: CAMPUS_TRACE_SMTP_USERNAME
        sync: false
      - key: CAMPUS_TRACE_SMTP_PASSWORD
        sync: false
      - key: CAMPUS_TRACE_SMTP_FROM
        sync: false
      - key: CAMPUS_TRACE_SMTP_USE_TLS
        value: "true"
    disk:
      name: campus-trace-data
      mountPath: /var/data
      sizeGB: 1
